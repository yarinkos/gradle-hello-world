name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      verify-arm64:
        description: Also pull and run the arm64 image on an ARM runner (master only)
        type: boolean
        default: false

# PRs: a newer push cancels the older run.
# master: runs queue instead. Two overlapping runs would both read the same last
# tag and both try to release the same version.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: yarinkos/gradle-hello-world
  EXPECTED_OUTPUT: Hello World from Yarin!

jobs:
  # ─── version ───────────────────────────────────────────────────────────────
  # Computes the version ONCE; every later job uses this output, so the jar,
  # the image tag and the git tag cannot drift apart. Nothing is written here:
  # the tag itself is only created by `release`, after everything passed.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # axion needs the tags and history

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # axion: last tag v1.0.0 + new commits -> 1.0.1-SNAPSHOT.
      # On master the SNAPSHOT suffix is dropped: this run IS the 1.0.1 release.
      # PRs keep it (e.g. 1.0.1-my-branch-SNAPSHOT), since they never release.
      - id: version
        run: |
          set -euo pipefail
          VERSION=$(./gradlew -q currentVersion -Prelease.quiet)
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            VERSION="${VERSION%-SNAPSHOT}"
          fi
          echo "Version: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  # ─── build ─────────────────────────────────────────────────────────────────
  # Tasks 5b-5d: compile, test, package, and keep the jar as a build artifact.
  build:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Also validates the checksum of gradle-wrapper.jar.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      # Fails in seconds on a formatting violation, before compiling anything.
      - name: Check formatting
        run: ./gradlew spotlessCheck

      - name: Compile, test and package
        run: ./gradlew build -PappVersion="$VERSION"

      - name: Run the jar
        run: |
          OUTPUT=$(java -jar "build/libs/gradle-hello-world-${VERSION}-all.jar")
          echo "$OUTPUT"
          [ "$OUTPUT" = "$EXPECTED_OUTPUT" ]

      - uses: actions/upload-artifact@v7
        with:
          name: gradle-hello-world-${{ env.VERSION }}
          path: build/libs/gradle-hello-world-${{ env.VERSION }}-all.jar
          if-no-files-found: error

  # ─── docker ────────────────────────────────────────────────────────────────
  # Task 5e-5f: build the multi-stage image tagged with the jar version.
  # PRs only build it (proves the Dockerfile works); master also pushes.
  # Multi-arch: amd64 for most servers and CI, arm64 for Apple Silicon Macs.
  docker:
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # Emulates arm64 for the runtime stage; the jar itself is built natively.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.ref == 'refs/heads/master'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          build-args: VERSION=${{ env.VERSION }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/master' }}
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── run ───────────────────────────────────────────────────────────────────
  # Task 5g: download the image that was just pushed and run it. A fresh pull
  # from Docker Hub, so this checks what was published, not a local build.
  # Always checks amd64. The arm64 image is always built and pushed, but running
  # it is optional: start the workflow manually with verify-arm64 = true.
  # It then runs on a native ARM runner, so no emulation is needed here.
  # (On push, `inputs` is empty, so verify-arm64 is false.)
  run:
    needs: [version, docker]
    if: github.ref == 'refs/heads/master'
    strategy:
      matrix:
        include: ${{ fromJSON(inputs.verify-arm64
          && '[{"platform":"linux/amd64","runner":"ubuntu-latest"},{"platform":"linux/arm64","runner":"ubuntu-24.04-arm"}]'
          || '[{"platform":"linux/amd64","runner":"ubuntu-latest"}]') }}
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Pull from Docker Hub
        run: docker pull --platform "$PLATFORM" "$IMAGE:$VERSION"

      - name: Run the image
        run: |
          OUTPUT=$(docker run --rm --platform "$PLATFORM" "$IMAGE:$VERSION")
          echo "$OUTPUT"
          [ "$OUTPUT" = "$EXPECTED_OUTPUT" ]

      - name: Check it does not run as root
        run: |
          USER_ID=$(docker run --rm --platform "$PLATFORM" --entrypoint id "$IMAGE:$VERSION" -u)
          echo "uid=${USER_ID}"
          [ "$USER_ID" != "0" ]

  # ─── release ───────────────────────────────────────────────────────────────
  # Only after the image was built, pushed, pulled and run: tag the commit and
  # publish a GitHub Release with the jar, so a tag always means a working build.
  release:
    needs: [version, run]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag and create the release
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # Same commit as the `version` job, so axion releases the same version.
      # Guarded anyway: a mismatch fails before anything is pushed.
      # A tag pushed with GITHUB_TOKEN does not trigger another workflow run.
      # A manual re-run (e.g. verify-arm64) on a commit that is already released
      # rebuilds and rechecks it, but must not try to release it again.
      - name: Tag v${{ env.VERSION }}
        id: tag
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "v${VERSION} already exists: nothing to release."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./gradlew -q release -Prelease.disableChecks -Prelease.localOnly
          RELEASED=$(./gradlew -q currentVersion -Prelease.quiet)
          if [ "$RELEASED" != "$VERSION" ]; then
            echo "::error::axion released ${RELEASED}, but the build used ${VERSION}"
            exit 1
          fi
          git push origin "v${VERSION}"
          echo "released=true" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        if: steps.tag.outputs.released == 'true'
        with:
          name: gradle-hello-world-${{ env.VERSION }}

      - name: Create GitHub Release
        if: steps.tag.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" "gradle-hello-world-${VERSION}-all.jar" \
            --title "v${VERSION}" \
            --generate-notes \
            --notes "Docker image: \`docker run --rm ${IMAGE}:${VERSION}\`"
